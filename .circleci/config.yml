version: 2.1

workflows:
  on-commit:
    jobs:
      - test

jobs:
  test:
    docker:
      - image: cimg/go:1.25
        environment:
          # The race detector needs cgo. This job ships no binary, so there is
          # nothing here that wants a static build.
          CGO_ENABLED: 1
    steps:
      - checkout
      - run: mkdir -p ./test-results
      - run:
          name: Run tests
          # -race because the config file is written under a lock and the tests
          # exercise that concurrently. -shuffle=on because the suite is meant to
          # have no order dependence: there is no viper, no package-level cobra
          # command and no os.Setenv, so every test runs in parallel.
          #
          # gotestsum is pinned in go.mod as a tool dependency, so this needs no
          # install step and CI runs the same version as a developer does.
          command: make test JUNIT=test-results/junit.xml
      # Every step below runs whatever the ones before it did, so one commit
      # produces every failure at once rather than hiding the lint error behind a
      # test failure and needing a second push to find it.
      - run:
          name: Lint
          when: always
          command: make lint JUNIT=test-results/lint-junit.xml
      - run:
          name: Verify codegen
          when: always
          # Regenerates the client and fails on any diff. This is the only thing
          # stopping someone hand-editing client.gen.go, and it also catches an
          # upstream spec change that makes an overlay action a no-op, because the
          # overlay is applied with strict: true.
          command: make verify-codegen
      - store_test_results:
          path: test-results
          when: always
